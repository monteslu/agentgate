<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 360 80" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d2818"/>
      <stop offset="100%" style="stop-color:#072413"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b0b8c4"/>
      <stop offset="35%" style="stop-color:#d8dde5"/>
      <stop offset="50%" style="stop-color:#f0f2f5"/>
      <stop offset="65%" style="stop-color:#d8dde5"/>
      <stop offset="100%" style="stop-color:#b0b8c4"/>
    </linearGradient>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5E3C"/>
      <stop offset="50%" style="stop-color:#6D4829"/>
      <stop offset="100%" style="stop-color:#7A5234"/>
    </linearGradient>
    <linearGradient id="woodHandle" xlink:href="#wood" x1="28.83" y1="67.00" x2="37.34" y2="75.64" gradientUnits="userSpaceOnUse"/>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
  </defs>
  <!-- Icon dark green background -->
  <rect x="4" y="4" width="72" height="72" rx="16" fill="url(#bg-grad)"/>
  <!-- Faint code rain -->
  <text x="12" y="16" font-family="monospace" font-size="7" fill="#10b981" opacity="0.1">01</text>
  <text x="28" y="12" font-family="monospace" font-size="7" fill="#10b981" opacity="0.07">10</text>
  <text x="54" y="14" font-family="monospace" font-size="7" fill="#10b981" opacity="0.08">11</text>
  <text x="60" y="68" font-family="monospace" font-size="7" fill="#10b981" opacity="0.07">01</text>
  <text x="46" y="72" font-family="monospace" font-size="7" fill="#10b981" opacity="0.1">10</text>
  <!-- Robot torso/suit -->
  <path d="M20 72 L20 44 L28 36 L52 36 L60 44 L60 72" fill="#374151"/>
  <!-- Suit lapels -->
  <path d="M28 36 L40 52 L52 36" fill="white"/>
  <!-- Tie -->
  <path d="M37 52 L40 72 L43 52 L40 46 Z" fill="#1a1a1a"/>
  <!-- Robot head -->
  <!-- Head: wider forehead, tapered jaw like Agent Smith -->
  <path d="M28 18 Q28 7 40 7 Q52 7 52 18 L52 22 Q52 27 49.5 31 L47 35 Q44 37 40 37 Q36 37 33 35 L30.5 31 Q28 27 28 22 Z" fill="url(#metal)"/>
  <!-- Aviator sunglasses bridge -->
  <line x1="38.5" y1="19.5" x2="41.5" y2="19.5" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Aviator left lens -->
  <path d="M30 18 Q30 15.5 32.5 15.5 L36 15.5 Q38.5 15.5 38.5 18 L38.5 21 Q38.5 23.5 36 23.5 L32 23.5 Q30 23 30 21 Z" fill="#1a1a1a" stroke="#333" stroke-width="0.6"/>
  <path d="M31.5 17 Q33 16.3 35 16.3" stroke="rgba(255,255,255,0.15)" stroke-width="0.5" fill="none"/>
  <!-- Aviator right lens -->
  <path d="M41.5 18 Q41.5 15.5 44 15.5 L47.5 15.5 Q50 15.5 50 18 L50 21 Q50 23.5 47.5 23.5 L44 23.5 Q41.5 23 41.5 21 Z" fill="#1a1a1a" stroke="#333" stroke-width="0.6"/>
  <path d="M43 17 Q44.5 16.3 46.5 16.3" stroke="rgba(255,255,255,0.15)" stroke-width="0.5" fill="none"/>
  <!-- Subtle smirk -->
  <path d="M35 29.5 Q40 31.5 45 29.5" stroke="#374151" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Blocking hand -->
  <rect x="6" y="34" width="16" height="22" rx="3" fill="url(#metal)" stroke="#9ca3af" stroke-width="0.5"/>
  <!-- Fingers -->
  <rect x="7" y="26" width="4" height="10" rx="1.5" fill="url(#metal)"/>
  <rect x="12" y="24" width="4" height="12" rx="1.5" fill="url(#metal)"/>
  <rect x="17" y="26" width="4" height="10" rx="1.5" fill="url(#metal)"/>
  <!-- Magnifying glass handle -->
  <line x1="28.83" y1="67.00" x2="37.34" y2="75.64" stroke="url(#woodHandle)" stroke-width="5.29" stroke-linecap="round"/>
  <!-- Magnifying glass -->
  <circle cx="19.97" cy="57.09" r="12" fill="none" stroke="#111" stroke-width="1.5"/>
  <circle cx="19.97" cy="57.09" r="10" fill="none" stroke="url(#metal)" stroke-width="4"/>
  <circle cx="20.06" cy="57.00" r="6" fill="rgba(255,255,255,0.2)"/>
  <!-- Text -->
  <text x="92" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" fill="#d4d4d4">agent</text>
  <text x="212" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="700" fill="url(#textGrad)">gate</text>
</svg>
