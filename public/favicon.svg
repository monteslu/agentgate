<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d2818"/>
      <stop offset="100%" style="stop-color:#072413"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b0b8c4"/>
      <stop offset="35%" style="stop-color:#d8dde5"/>
      <stop offset="50%" style="stop-color:#f0f2f5"/>
      <stop offset="65%" style="stop-color:#d8dde5"/>
      <stop offset="100%" style="stop-color:#b0b8c4"/>
    </linearGradient>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5E3C"/>
      <stop offset="50%" style="stop-color:#6D4829"/>
      <stop offset="100%" style="stop-color:#7A5234"/>
    </linearGradient>
    <linearGradient id="woodHandle" xlink:href="#wood" x1="22.22" y1="52.27" x2="30.43" y2="58.95" gradientUnits="userSpaceOnUse"/>
  </defs>
  <!-- Dark green background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg-grad)"/>
  <!-- Faint code rain -->
  <text x="8" y="14" font-family="monospace" font-size="6" fill="#10b981" opacity="0.1">01</text>
  <text x="20" y="10" font-family="monospace" font-size="6" fill="#10b981" opacity="0.07">10</text>
  <text x="44" y="12" font-family="monospace" font-size="6" fill="#10b981" opacity="0.08">11</text>
  <text x="50" y="56" font-family="monospace" font-size="6" fill="#10b981" opacity="0.07">01</text>
  <text x="38" y="60" font-family="monospace" font-size="6" fill="#10b981" opacity="0.1">10</text>
  <!-- Robot torso/suit -->
  <path d="M16 58 L16 36 L24 30 L40 30 L48 36 L48 58" fill="#374151"/>
  <!-- Suit lapels -->
  <path d="M24 30 L32 42 L40 30" fill="white"/>
  <!-- Tie -->
  <path d="M30 42 L32 58 L34 42 L32 38 Z" fill="#1a1a1a"/>
  <!-- Robot head -->
  <!-- Head: wider forehead, tapered jaw like Agent Smith -->
  <path d="M22 16 Q22 7 32 7 Q42 7 42 16 L42 20 Q42 24 39.5 27 L37 31 Q35 33 32 33 Q29 33 27 31 L24.5 27 Q22 24 22 20 Z" fill="url(#metal)"/>
  <!-- Aviator sunglasses bridge -->
  <line x1="30.5" y1="17.5" x2="33.5" y2="17.5" stroke="#1a1a1a" stroke-width="0.8"/>
  <!-- Aviator left lens -->
  <path d="M24 16.5 Q24 14.5 26 14.5 L29 14.5 Q30.5 14.5 30.5 16.5 L30.5 19 Q30.5 21 28.5 21 L25.5 21 Q24 20.5 24 19 Z" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
  <path d="M25 15.8 Q26 15.3 27.5 15.3" stroke="rgba(255,255,255,0.15)" stroke-width="0.4" fill="none"/>
  <!-- Aviator right lens -->
  <path d="M33.5 16.5 Q33.5 14.5 35.5 14.5 L38.5 14.5 Q40 14.5 40 16.5 L40 19 Q40 21 38 21 L35 21 Q33.5 20.5 33.5 19 Z" fill="#1a1a1a" stroke="#333" stroke-width="0.5"/>
  <path d="M34.5 15.8 Q35.5 15.3 37 15.3" stroke="rgba(255,255,255,0.15)" stroke-width="0.4" fill="none"/>
  <!-- Subtle smirk -->
  <path d="M28 25.5 Q32 27 36 25.5" stroke="#374151" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Blocking hand -->
  <rect x="4" y="28" width="14" height="18" rx="2" fill="url(#metal)" stroke="#9ca3af" stroke-width="0.5"/>
  <!-- Fingers -->
  <rect x="5" y="22" width="3" height="8" rx="1" fill="url(#metal)"/>
  <rect x="9" y="20" width="3" height="10" rx="1" fill="url(#metal)"/>
  <rect x="13" y="22" width="3" height="8" rx="1" fill="url(#metal)"/>
  <!-- Magnifying glass handle -->
  <line x1="22.22" y1="52.27" x2="30.43" y2="58.95" stroke="url(#woodHandle)" stroke-width="4.05" stroke-linecap="round"/>
  <!-- Magnifying glass -->
  <circle cx="15.06" cy="45.90" r="9.5" fill="none" stroke="#111" stroke-width="1.5"/>
  <circle cx="15.06" cy="45.90" r="8" fill="none" stroke="url(#metal)" stroke-width="3"/>
  <circle cx="14.64" cy="45.48" r="5" fill="rgba(255,255,255,0.2)"/>
</svg>
